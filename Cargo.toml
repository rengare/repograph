[workspace]
resolver = "3"
members = ["crates/*"]
# No `default-members`: a bare `cargo build`/`test` covers every crate, so the
# CLI and MCP binaries are never left stale behind a gv-app-only build.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Visualization crates, forked from graphvisualizer-rs. Dependency direction is
# strictly downward:
#   gv-app -> gv-gui, gv-render, gv-layout-gpu -> gv-gpu -> gv-graph
#                  \-> gv-layout ------------------------/
#   gv-config is a leaf depended on by anything that reads settings.
gv-config = { path = "crates/gv-config" }
gv-graph = { path = "crates/gv-graph" }
gv-layout = { path = "crates/gv-layout" }
gv-gpu = { path = "crates/gv-gpu" }
gv-layout-gpu = { path = "crates/gv-layout-gpu" }
gv-render = { path = "crates/gv-render" }
gv-gui = { path = "crates/gv-gui" }
gv-app = { path = "crates/gv-app" }

# Knowledge-graph crates (this project).
rkg-core = { path = "crates/rkg-core" }
rkg-ingest = { path = "crates/rkg-ingest" }

anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = "0.35.0"
egui-wgpu = { version = "0.35.0", features = ["winit", "x11", "wayland"] }
# Default features pull `arboard` (clipboard), which does not compile on wasm.
# gv-app re-enables clipboard for native targets only.
egui-winit = { version = "0.35.0", default-features = false }
env_logger = "0.11.11"
glam = { version = "0.33.2", features = ["bytemuck"] }
log = "0.4.33"
pollster = "1.0.1"
rand = "0.10.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Knowledge-graph tooling.
ignore = "0.4.23"
clap = { version = "4.5.51", features = ["derive", "env"] }
# Symbol extraction. The grammar crates target `tree-sitter-language`, so they
# are runtime-version agnostic and load into a 0.25 parser via `.into()`.
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-c-sharp = "0.23"
# Pinned to what egui-wgpu 0.35 depends on. Two wgpu versions in the graph
# means two incompatible sets of types, and the egui pass takes our encoder.
# `fragile-send-sync-non-atomic-wasm` relaxes the Send bound on GPU handles for
# the single-threaded browser; it has no effect on native.
wgpu = { version = "29.0.4", features = ["fragile-send-sync-non-atomic-wasm"] }
winit = "0.30.13"

# Layout algorithms are unusable at interactive speed in a debug build; the
# dependency graph is large but stable, so optimising it always is cheap.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
