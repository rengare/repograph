[package]
name = "gv-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
gv-graph.workspace = true

console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCanvasElement",
  "HtmlInputElement",
  "HtmlSelectElement",
  "MouseEvent",
  "Node",
  "WheelEvent",
  "Window",
] }
